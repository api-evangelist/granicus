aid: granicus

name: Granicus

description: 'Granicus (Granicus, Inc.) describes itself as the Citizen Experience Platform for government: cloud software that, per its website,
  connects 330M people and 7,000+ government organizations. Its products, including the govDelivery digital communications platform, help public-sector
  agencies run websites, citizen engagement and notifications, meetings and agenda management, records and service delivery. Its public GitHub
  organization is github.com/granicus.'

