apis:
- aid: granicus:govdelivery-tms-api
  name: GovDelivery Transactional Messaging Service (TMS) API
  description: >-
    REST API for sending transactional email, SMS and voice messages, managing message templates, keywords,
    inbound messages and webhooks, published by Granicus as a RAML 0.8 contract (baseUri https://tms.govdelivery.com,
    token authentication).
  humanURL: https://developers.govdelivery.com/api/tms/
  baseURL: https://tms.govdelivery.com
  tags:
  - Messaging
  - Email
  - SMS
  properties:
  - type: RAML
    url: openapi/_original/granicus-govdelivery-tms.raml
  - type: RAML (provider-hosted)
    url: https://developers.govdelivery.com/api/tms/tms.raml
  - type: Documentation
    url: https://developers.govdelivery.com/api/tms/
- aid: granicus:govdelivery-communications-cloud-api
  name: GovDelivery Communications Cloud API
  description: >-
    API for the govDelivery Communications Cloud, documented by Granicus on its GovDelivery API documentation
    site ("Resources and Guides for Communications Cloud, TMS, Interactive Text and Reports PRO API");
    no machine-readable contract is published and the readable docs landing page does not state a base
    URL.
  humanURL: https://developers.govdelivery.com/api/comm_cloud_v1/Default.htm
  tags:
  - Digital Communications
  properties:
  - type: Documentation
    url: https://developers.govdelivery.com/api/comm_cloud_v1/Default.htm
  - type: Portal
    url: https://developers.govdelivery.com/
- aid: granicus:platform-soap-api
  name: Granicus Platform SOAP API
  description: >-
    SOAP web services for the Granicus MediaManager meeting-media platform (User SDK with 98 operations,
    MediaVault SDK, and the MeetingServer encoder service), published as WSDLs in Granicus' own GitHub
    repositories granicus/platform-api-java and granicus/platform-api-net; the WSDL soap:address entries
    point at granicus.com hosts (e.g. .../sdk/user/index.php), with no single public production endpoint
    stated.
  humanURL: https://github.com/granicus/platform-api-java
  tags:
  - SOAP
  - Meetings
  - Media
  properties:
  - type: WSDL
    url: wsdl/granicus-platform-user-sdk.wsdl
  - type: WSDL
    url: wsdl/granicus-mediavault-sdk.wsdl
  - type: WSDL
    url: wsdl/granicus-encoder.wsdl
  - type: GitHubRepository
    url: https://github.com/granicus/platform-api-java
  - type: GitHubRepository
    url: https://github.com/granicus/platform-api-net
