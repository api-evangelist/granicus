overlay: 1.0.0
info:
  title: API Evangelist overlay for Granicus Legistar Web API
  version: 1.0.0
extends: ../openapi/_original/granicus-legistar-openapi.yml
x-generated: '2026-10-18'
x-method: generated
x-source: https://webapi.legistar.com/Home/Examples
x-rationale: 'The captured spec has no securitySchemes and no query parameters for OData paging/filtering, both documented on the Legistar Examples page. This overlay adds them without mutating the original. Note: the spec reuses some operationIds (e.g. MatterIndexes_GetAllForMatter, MatterIndexes_Put, MatterIndexes_Delete) on two paths.'
actions:
- target: $.components
  description: Add the optional Legistar `token` URL parameter documented on the Examples page.
  update:
    securitySchemes:
      legistarToken:
        type: apiKey
        in: query
        name: token
        description: 'Some Legistar clients require an API token, provided as a URL parameter (?token=...). Read-only calls for most clients need none. Source: https://webapi.legistar.com/Home/Examples'
- target: $
  description: Make the token optional at the root (empty requirement = anonymous allowed).
  update:
    security:
    - {}
    - legistarToken: []
- target: $.info
  description: Document documented query limits.
  update:
    x-result-limit: 1000
    x-query-language: OData v3 URL conventions ($filter, $top, $skip, $orderby)
    x-source: https://webapi.legistar.com/Home/Examples
