components:
  schemas:
    GranicusIndex:
      required:
      - indexName
      type: object
      properties:
        indexId:
          format: int32
          type: integer
        indexGuid:
          type: string
        indexLastModifiedUtc:
          format: date-time
          type: string
        indexRowVersion:
          format: byte
          type: string
        indexName:
          type: string
        indexActiveFlag:
          format: int32
          type: integer
        indexUsedFlag:
          format: int32
          type: integer
        api_metadata:
          type: string
