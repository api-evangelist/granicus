      - voteValueId
      type: object
      properties:
        voteId:
          format: int32
          type: integer
        voteGuid:
          type: string
        voteLastModifiedUtc:
          format: date-time
          type: string
        voteRowVersion:
          format: byte
          type: string
        votePersonId:
          format: int32
          type: integer
        votePersonName:
          type: string
        voteValueId:
          format: int32
          type: integer
        voteValueName:
          type: string
        voteSort:
          format: int32
          type: integer
        voteResult:
          format: int32
          type: integer
        voteEventItemId:
          format: int32
          type: integer
