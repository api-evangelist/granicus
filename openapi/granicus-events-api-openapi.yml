        in: path
        description: The Id of the Event.
        required: true
        schema:
          type: integer
          format: int32
      - name: EventItems
        in: query
        description: An optional parameter that specifies whether the event items should be included. Set to 1 to include. 0 by default.
        required: false
        schema:
          type: integer
          format: int32
      - name: AgendaNote
        in: query
        description: An optional parameter that specifies whethere the event items' agenda note should be included. Set to 1 to include. 0 by default.
        required: false
        schema:
          type: integer
          format: int32
      - name: MinutesNote
        in: query
        description: An optional parameter that specifies whethere the event items' minutes note should be included. Set to 1 to include. 0 by default.
        required: false
        schema:
          type: integer
          format: int32
      - name: EventItemAttachments
        in: query
        description: An optional parameter that specifies whether the event items' attachments should be included. Set to 1 to include. 0 by default.
        required: false
        schema:
          type: integer
          format: int32
