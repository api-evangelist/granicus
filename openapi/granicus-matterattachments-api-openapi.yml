openapi: 3.2.0
info:
  title: Granicus Matter Attachments API
  version: v1
  description: 'Operations tagged MatterAttachments across 2 of this provider''s published API definitions: granicus-legistar-swagger.json, granicus-legistar-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://webapi.legistar.com
tags:
- name: MatterAttachments
paths:
