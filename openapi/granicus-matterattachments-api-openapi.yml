            application/json-p:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GranicusMatterAttachment'
    post:
      tags:
      - MatterAttachments
      summary: Adds one Matter Attachment
      description: 'To upload an attachment file, it can either be provided as MatterAttachmentBinary (base64 encoded) with a MatterAttachmentFileName including

        a file extension or by specifying a MatterAttachmentHyperlink and setting MatterAttachmentIsHyperlink to false. This second method will

        download the URL and save it as a local file.'
      operationId: MatterAttachments_Post
      parameters:
      - name: Client
        in: path
        description: The code of the Client database to connect to.
        required: true
        schema:
          type: string
      - name: MatterId
        in: path
        description: The MatterId of the Matter.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/javascript:
              schema:
                type: object
            application/javascript:
              schema:
                type: object
            application/json-p:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GranicusMatterAttachment'
          text/json:
            schema:
              $ref: '#/components/schemas/GranicusMatterAttachment'
          application/xml:
            schema:
              $ref: '#/components/schemas/GranicusMatterAttachment'
          text/xml:
            schema:
              $ref: '#/components/schemas/GranicusMatterAttachment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GranicusMatterAttachment'
        description: GranicusMatterAttachment object to be inserted. Note that MatterAttachmentId is not required to be set. MatterAttachmentSort is auto-generated and should not be set.
        required: true
    servers:
    - url: https://webapi.legistar.com
