      - MatterAttachments
      summary: Gets all available for Internet viewing Matter Attachments for one Matter record
      operationId: MatterAttachments_GetAll
      parameters:
      - name: Client
        in: path
        description: The code of the Client database to connect to.
        required: true
        schema:
          type: string
      - name: MatterId
        in: path
        description: The MatterId of the Matter.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GranicusMatterAttachment'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GranicusMatterAttachment'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GranicusMatterAttachment'
            text/xml:
              schema:
                type: array
                items:
