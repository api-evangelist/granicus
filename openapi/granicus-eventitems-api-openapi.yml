        required: true
        schema:
          type: integer
          format: int32
      - name: AgendaNote
        in: query
        description: An optional parameter that specifies whether the agenda note should be included. Set to 1 to include. 0 by default.
        required: false
        schema:
          type: integer
          format: int32
      - name: MinutesNote
        in: query
        description: An optional parameter that specifies whether the minutes note should be included. Set to 1 to include. 0 by default.
        required: false
        schema:
          type: integer
          format: int32
      - name: Attachments
        in: query
        description: An optional parameter that specifies whether the event items' attachments should be included. Set to 1 to include. 0 by default.
        required: false
        schema:
          type: integer
          format: int32
      responses:
